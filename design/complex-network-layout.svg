<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" role="img" aria-labelledby="title desc">
<title id="title">Complex network layout design reference</title><desc id="desc">Fictional double-track trunk through Mizuno, Kawara and Higashi; north branch through Ume and Kitayama; south relief through a freight depot with two terminal sidings. This is a static design reference, not simulated state.</desc>
<defs><style>.rail{fill:none;stroke:#e3e3c8;stroke-width:10;stroke-linejoin:miter}.inner{fill:none;stroke:#b5c6a8;stroke-width:6}.north{fill:none;stroke:#c2a7c8;stroke-width:6}.south{fill:none;stroke:#c8b785;stroke-width:6}.label{fill:#eee9cc;font:24px Arial,sans-serif}.small{fill:#d0d6ba;font:15px Arial,sans-serif}.berth{fill:#102d2c;stroke:#99a891;stroke-width:5}.id{fill:#e58fa6;font:20px monospace}.point{fill:#254f47;stroke:#e9e4bf;stroke-width:3}.dot{fill:#eac178;stroke:#d8dfc3;stroke-width:2}</style></defs>
<rect width="1920" height="1000" fill="#345b57"/><rect x="15" y="15" width="1890" height="970" rx="4" fill="none" stroke="#99a88d" stroke-width="10"/>
<path d="M35 42H1880" stroke="#b37a70" stroke-width="9"/><text x="55" y="82" class="label">THE CONNECTING LINE · COMPLEX BOARD REFERENCE</text><text x="55" y="111" class="small">FICTIONAL TOPOLOGY · STATIC DESIGN · NOT SIMULATED POSITIONS</text>
<!-- Parallel trunk, three-track station fans, crossovers and boundaries. -->
<path class="rail" d="M45 480H1875M45 550H1875M550 480L610 410H890L950 480M1250 480L1310 410H1600L1660 480M155 480L225 550M405 550L475 480M640 550L710 480M980 480L1050 550M1320 550L1390 480M1630 480L1700 550"/>
<path class="inner" d="M45 480H1875M45 550H1875M550 480L610 410H890L950 480M1250 480L1310 410H1600L1660 480M155 480L225 550M405 550L475 480M640 550L710 480M980 480L1050 550M1320 550L1390 480M1630 480L1700 550"/>
<!-- Northern branch, two stations with passing loops, third boundary. -->
<path class="rail" d="M880 410L940 340V230H1875M950 230L990 170H1105L1145 230M1430 230L1470 170H1605L1645 230"/><path class="north" d="M880 410L940 340V230H1875M950 230L990 170H1105L1145 230M1430 230L1470 170H1605L1645 230"/>
<!-- Genuine alternative relief circuit with two reception roads and terminal sidings. -->
<path class="rail" d="M900 550L970 640V770H1240L1380 630V550M1010 770L1050 840H1210L1250 770M1120 840L1180 910H1370M1210 840L1270 960H1450"/><path class="south" d="M900 550L970 640V770H1240L1380 630V550M1010 770L1050 840H1210L1250 770M1120 840L1180 910H1370M1210 840L1270 960H1450"/>
<path d="M1370 892V928M1450 942V978" stroke="#dfe4c9" stroke-width="7"/>
<!-- Location headers, same horizontal grammar as the museum. -->
<g class="label"><text x="75" y="420">KYOTO</text><text x="250" y="350">MIZUNO</text><text x="690" y="350">KAWARA JUNCTION</text><text x="1405" y="350">HIGASHI</text><text x="1760" y="420">NARA</text><text x="1000" y="140">UME</text><text x="1470" y="140">KITAYAMA</text><text x="1780" y="180">NORTH</text><text x="1010" y="710">FREIGHT DEPOT</text></g>
<g class="small"><text x="250" y="375">100 · TWO PLATFORMS</text><text x="690" y="375">200 · BRANCH / TRUNK / RELIEF</text><text x="1405" y="375">300 · THREE TRACKS</text><text x="960" y="278">SINGLE-TRACK PASSENGER BRANCH</text><text x="1010" y="738">RECEPTION 1 / 2 · RELIEF ROUTE</text><text x="1400" y="914">SIDING A</text><text x="1470" y="963">SIDING B</text><text x="50" y="645">DOUBLE-TRACK TRUNK · CROSSOVER CHOICES</text></g>
<!-- Framed number windows sit on the paths rather than replacing the map with cards. -->
<g><rect class="berth" x="255" y="460" width="100" height="39"/><rect class="berth" x="255" y="530" width="100" height="39"/><rect class="berth" x="715" y="390" width="100" height="39"/><rect class="berth" x="715" y="460" width="100" height="39"/><rect class="berth" x="715" y="530" width="100" height="39"/><rect class="berth" x="1420" y="390" width="100" height="39"/><rect class="berth" x="1420" y="460" width="100" height="39"/><rect class="berth" x="1420" y="530" width="100" height="39"/><rect class="berth" x="1005" y="150" width="90" height="39"/><rect class="berth" x="1005" y="210" width="90" height="39"/><rect class="berth" x="1485" y="150" width="90" height="39"/><rect class="berth" x="1485" y="210" width="90" height="39"/><rect class="berth" x="1080" y="750" width="100" height="39"/><rect class="berth" x="1080" y="820" width="100" height="39"/></g>
<g class="id"><text x="270" y="486">301 →</text><text x="733" y="556">← 402</text><text x="1438" y="416">217 →</text><text x="1020" y="177">N51 →</text><text x="1093" y="847">F71 →</text></g>
