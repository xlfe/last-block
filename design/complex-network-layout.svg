<g class="point"><circle cx="155" cy="480" r="9"/><circle cx="225" cy="550" r="9"/><circle cx="405" cy="550" r="9"/><circle cx="475" cy="480" r="9"/><circle cx="550" cy="480" r="9"/><circle cx="950" cy="480" r="9"/><circle cx="880" cy="410" r="9"/><circle cx="900" cy="550" r="9"/><circle cx="640" cy="550" r="9"/><circle cx="710" cy="480" r="9"/><circle cx="980" cy="480" r="9"/><circle cx="1050" cy="550" r="9"/><circle cx="950" cy="230" r="9"/><circle cx="1145" cy="230" r="9"/><circle cx="1430" cy="230" r="9"/><circle cx="1645" cy="230" r="9"/><circle cx="1250" cy="480" r="9"/><circle cx="1660" cy="480" r="9"/><circle cx="1380" cy="550" r="9"/><circle cx="1010" cy="770" r="9"/><circle cx="1250" cy="770" r="9"/><circle cx="1120" cy="840" r="9"/><circle cx="1210" cy="840" r="9"/></g>
<g class="small"><text x="130" y="457">M01</text><text x="200" y="590">M02</text><text x="865" y="395">K03</text><text x="882" y="595">K06</text><text x="1345" y="595">H05</text><text x="945" y="310">U01</text><text x="1090" y="310">U02</text></g>
<!-- A few small signal stems / lenses and status squares provide physical grammar only. -->
<g stroke="#e3dfc4" stroke-width="3"><path d="M510 460V440H495M1180 530V510H1165M1740 460V440H1725"/></g><g class="dot"><circle cx="495" cy="440" r="8"/><circle cx="1165" cy="510" r="8"/><circle cx="1725" cy="440" r="8"/></g>
<g fill="#d4c78f" stroke="#a0ac8b"><rect x="270" y="310" width="13" height="13"/><rect x="290" y="310" width="13" height="13"/><rect x="730" y="310" width="13" height="13"/><rect x="750" y="310" width="13" height="13"/><rect x="1450" y="310" width="13" height="13"/><rect x="1470" y="310" width="13" height="13"/></g>
<text x="55" y="920" class="small">All operational branches require real routes/resources.</text><text x="55" y="948" class="small">Normal/reverse point blades must redraw from live state.</text><text x="55" y="976" class="small">Reference geometry, train IDs and point labels are illustrative.</text>
</svg>
